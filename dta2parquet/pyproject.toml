[project]
name = "dta2parquet"
version = "0.1.0"
description = "Fast Stata .dta to Parquet conversion that preserves Stata metadata (labels, value labels, notes, formats) for the pq Stata package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=1.30",
    "pyarrow>=16",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=2.3.3",
    "pyreadstat>=1.3.7",
    "pytest>=9.2.0",
]

[project.scripts]
dta2parquet = "dta2parquet.cli:main"
